<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="50%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#02050a" />
    </linearGradient>
    
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#00a8ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0044aa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#001133" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Tech Grid Background -->
  <g opacity="0.08" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Corner Brackets (HUD aesthetics) -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.8" />
  <path d="M 1170 50 L 1170 30 L 1150 30" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.8" />
  <path d="M 30 370 L 30 390 L 50 390" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.8" />
  <path d="M 1170 370 L 1170 390 L 1150 390" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.8" />

  <!-- Arc Reactor Visual (Left Side) -->
  <g transform="translate(240, 210)">
    <!-- Ambient Glow Circle -->
    <circle cx="0" cy="0" r="140" fill="url(#reactorGlow)" />
    
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="12 6" opacity="0.6" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00d2ff" stroke-width="3" opacity="0.7" />
    
    <!-- 8 Arc Reactor Coils -->
    <g stroke="#00f3ff" stroke-width="3" opacity="0.8" filter="url(#glow)">
      <line x1="0" y1="-85" x2="0" y2="-65" />
      <line x1="60" y1="-60" x2="46" y2="-46" />
      <line x1="85" y1="0" x2="65" y2="0" />
      <line x1="60" y1="60" x2="46" y2="46" />
      <line x1="0" y1="85" x2="0" y2="65" />
      <line x1="-60" y1="60" x2="-46" y2="46" />
      <line x1="-85" y1="0" x2="-65" y2="0" />
      <line x1="-60" y1="-60" x2="-46" y2="-46" />
    </g>

    <!-- Inner Core Rings -->
    <circle cx="0" cy="0" r="55" fill="#031020" stroke="#00f3ff" stroke-width="2" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3" />
    <polygon points="0,-28 24,14 -24,14" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="125" ry="50" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="125" ry="50" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" transform="rotate(35)" />
  </g>

  <!-- Title & Branding (Right Side) -->
  <g transform="translate(460, 0)">
    <!-- Sub-badge -->
    <rect x="0" y="85" width="280" height="26" rx="4" fill="#002b4d" stroke="#00f3ff" stroke-width="1" opacity="0.9" />
    <text x="14" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00f3ff" letter-spacing="2">
      STARK INDUSTRIES • MARK VII
    </text>

    <!-- Main Title -->
    <text x="0" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="8" filter="url(#glow)">
      J.A.R.V.I.S.
    </text>

    <!-- Subtitle -->
    <text x="2" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="3">
      JUST A RATHER VERY INTELLIGENT SYSTEM
    </text>

    <line x1="0" y1="235" x2="680" y2="235" stroke="url(#cyanLine)" stroke-width="2" />

    <!-- Feature Bullet Badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1: 100% Local GPU -->
      <rect x="0" y="0" width="195" height="36" rx="6" fill="#07182e" stroke="#10b981" stroke-width="1.5" />
      <circle cx="18" cy="18" r="5" fill="#10b981" />
      <text x="32" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
        OLLAMA / 100% LOCAL
      </text>

      <!-- Badge 2: Optional Gemini -->
      <rect x="210" y="0" width="195" height="36" rx="6" fill="#07182e" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="228" cy="18" r="5" fill="#a855f7" />
      <text x="242" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
        GEMINI CLOUD READY
      </text>

      <!-- Badge 3: Duplex Voice -->
      <rect x="420" y="0" width="195" height="36" rx="6" fill="#07182e" stroke="#00f3ff" stroke-width="1.5" />
      <circle cx="438" cy="18" r="5" fill="#00f3ff" />
      <text x="452" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
        HANDS-FREE DUPLEX
      </text>
    </g>

    <!-- Bottom Secondary Badges -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="135" height="28" rx="4" fill="#0c1e38" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        🧠 MEMORY VAULT
      </text>

      <rect x="150" y="0" width="145" height="28" rx="4" fill="#0c1e38" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        ⚡ COMPUTER TOOLS
      </text>

      <rect x="310" y="0" width="135" height="28" rx="4" fill="#0c1e38" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        🔗 n8n AUTOMATION
      </text>

      <rect x="460" y="0" width="145" height="28" rx="4" fill="#0c1e38" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        🌐 DUCKDUCKGO WEB
      </text>
    </g>

    <!-- Telemetry Status Line -->
    <text x="2" y="375" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#64748b">
      STATUS: ALL SYSTEMS NOMINAL | PROTOCOL: LOCAL HOST (127.0.0.1:8000) | VERIFIED: 68/68 TESTS
    </text>
  </g>
</svg>
